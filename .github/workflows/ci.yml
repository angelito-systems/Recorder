name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: choco install ffmpeg -y --no-progress   # the tests run real exports
      # tests → single-file exe → MSI (+ .sha256). Signing happens only where a certificate is configured.
      - run: pwsh build/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AngelitoScreenStudio-msi
          path: |
            artifacts/*.msi
            artifacts/*.sha256
